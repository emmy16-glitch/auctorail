name: Deploy Auctorail Permit Gate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_GATE to authorize one Base Sepolia contract deployment and up to 2 USDC initial funding'
        required: true
        type: string
  push:
    branches:
      - feature/onchain-permit-gate

concurrency:
  group: auctorail-permit-gate-deploy
  cancel-in-progress: false

jobs:
  deploy-gate:
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_GATE') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy-gate:')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN2 || secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: emmy16-glitchs-projects
      VERCEL_PROJECT_NAME: auctorail
      VERCEL_PROJECT_ID: prj_rZ6wYUM1lXd1xn37JuRO2vDjL6uM
      VERCEL_TEAM_ID: team_B3UZA8Zjc2LnB8A2nJhjfe5n
      AUCTORAIL_GATE_FUND_RAW: '2000000'

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Neither VERCEL_TOKEN2 nor VERCEL_TOKEN is configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Link exact Vercel project
        run: npx --yes vercel@latest link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Load only the deployment key from Vercel API
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`);
          url.searchParams.set('decrypt', 'true');
          url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }
          });
          if (!response.ok) {
            throw new Error(`vercel_env_api_failed:http_${response.status}`);
          }
          const body = await response.json();
          const candidates = [
            'AUCTORAIL_ONCHAIN_PERMIT_PRIVATE_KEY',
            'PROOFGATE_EXECUTOR_PRIVATE_KEY',
            'TELEGRAPH_EVM_PRIVATE_KEY'
          ];
          const envs = Array.isArray(body.envs) ? body.envs : [];
          const selected = candidates
            .map((key) => envs.find((item) =>
              item?.key === key &&
              Array.isArray(item.target) &&
              item.target.includes('production') &&
              typeof item.value === 'string' &&
              /^0x[0-9a-fA-F]{64}$/.test(item.value)
            ))
            .find(Boolean);
          if (!selected) {
            throw new Error('no_decryptable_production_executor_key_found');
          }
          console.log(`Using masked Vercel deployment credential: ${selected.key}`);
          console.log(`::add-mask::${selected.value}`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `AUCTORAIL_ONCHAIN_PERMIT_PRIVATE_KEY=${selected.value}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Compile permit gate with pinned native solc
        run: npm run gate:compile

      - name: Deploy and fund exactly once on Base Sepolia
        run: node --import tsx scripts/deploy-permit-gate.ts

      - name: Upload public deployment record
        uses: actions/upload-artifact@v4
        with:
          name: auctorail-permit-gate-deployment
          path: data/deployments/base-sepolia-permit-gate.json
          if-no-files-found: error
          retention-days: 30
