name: Deploy Auctorail Permit Gate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_GATE to authorize one Base Sepolia contract deployment and up to 2 USDC initial funding'
        required: true
        type: string

concurrency:
  group: auctorail-permit-gate-deploy
  cancel-in-progress: false

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN2 || secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: emmy16-glitchs-projects
      VERCEL_PROJECT_NAME: auctorail
      AUCTORAIL_GATE_FUND_RAW: '2000000'

    steps:
      - name: Require explicit deployment confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_GATE" ]; then
            echo "::error::Deployment not confirmed. Enter DEPLOY_GATE exactly."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Neither VERCEL_TOKEN2 nor VERCEL_TOKEN is configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Link exact Vercel project
        run: npx --yes vercel@latest link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Pull production secrets without printing them
        run: npx --yes vercel@latest pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Compile permit gate with pinned native solc
        run: npm run gate:compile

      - name: Deploy and fund exactly once on Base Sepolia
        run: node --env-file=.vercel/.env.production.local --import tsx scripts/deploy-permit-gate.ts

      - name: Upload public deployment record
        uses: actions/upload-artifact@v4
        with:
          name: auctorail-permit-gate-deployment
          path: data/deployments/base-sepolia-permit-gate.json
          if-no-files-found: error
          retention-days: 30
