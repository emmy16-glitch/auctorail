name: live-probe
on:
  push:
    branches: [ arena/01a07716-auctorail ]
    paths:
      - 'scripts/live-capture.mjs'
      - '.github/workflows/live-probe.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/01a07716-auctorail }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-audit --no-fund playwright @ffmpeg-installer/ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-capture.mjs
      - name: convert + push
        run: |
          FF=node_modules/@ffmpeg-installer/linux-x64/ffmpeg; chmod +x $FF
          WEBM=$(ls live-out/vid/*.webm 2>/dev/null | head -1)
          if [ -n "$WEBM" ]; then $FF -y -i "$WEBM" -vf scale=1920:1080 -c:v libx264 -crf 20 -an live-out/live-execution.mp4 || true; fi
          git config user.name "arena-bot" && git config user.email "arena@bots.local"
          git add live-out
          git commit -m "live capture from runner" || echo "nothing to commit"
          git push origin HEAD:arena/01a07716-auctorail || true
