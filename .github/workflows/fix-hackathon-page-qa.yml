name: fix-hackathon-page-qa
on:
  push:
    branches: [ fix/hackathon-page-qa ]
    paths: [ 'fix-hackathon-page-qa-trigger.txt' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hackathon-page-qa
      - name: Align final browser audit with shipped copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qa/auctorail-final-playwright.py')
          s = p.read_text()
          replacements = {
            'name="ENTER LIVE MODE", exact=False': 'name="RUN A REAL TESTNET TRANSFER", exact=False',
            'name="Paste it. Check the evidence before you act."': 'name="The same rail. A different threat."',
            'name="CHECK CONTENT", exact=False': 'name="TRY IT — CHECK SUSPICIOUS CONTENT", exact=False',
            'name="WATCH DEMO", exact=False': 'name="WATCH THE RAIL HOLD", exact=False',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing QA selector: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-hackathon-page-qa.yml fix-hackathon-page-qa-trigger.txt
          git config user.name "emmy16-glitch"
          git config user.email "74790322+emmy16-glitch@users.noreply.github.com"
          git add -A
          git commit -m "test: align browser audit with hackathon page copy"
          git push origin HEAD:fix/hackathon-page-qa
