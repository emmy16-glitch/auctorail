name: Auctorail Live Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-production-smoke:
    if: github.event.head_commit.message == 'test: run live production authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run bounded live authorization checks
        env:
          AUCTORAIL_BASE_URL: https://auctorail.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.AUCTORAIL_BASE_URL;
          const destination = '0xB38d0405DF1b15961aEf29C7c45f2ED285822c14';

          async function post(path, body, headers = {}) {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: { 'content-type': 'application/json', ...headers },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(30_000)
            });
            const text = await response.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = { raw: text }; }
            return { status: response.status, body: parsed };
          }

          const results = [];
          for (let i = 1; i <= 3; i++) {
            const reference = `github-live-smoke-${Date.now()}-${i}`;
            const common = {
              limit: '5.00',
              amount: '1.00',
              destination,
              durationSeconds: 3600,
              reason: `Live Telegraph production smoke ${i}`,
              reference
            };

            const policy = await post('/api/authorize', { mode: 'policy', ...common });
            console.log(`\n=== ATTEMPT ${i} POLICY ===`);
            console.log(JSON.stringify(policy, null, 2));

            const freezeFingerprint = policy.body?.freezeFingerprint;
            if (policy.status !== 200 || typeof freezeFingerprint !== 'string') {
              results.push({ attempt: i, policy, live: null });
              continue;
            }

            const idempotencyKey = `live-smoke-${Date.now()}-${i}-${Math.random().toString(16).slice(2)}`;
            const live = await post(
              '/api/authorize',
              { mode: 'live', ...common, freezeFingerprint },
              { 'idempotency-key': idempotencyKey }
            );
            console.log(`\n=== ATTEMPT ${i} LIVE ===`);
            console.log(JSON.stringify(live, null, 2));
            results.push({ attempt: i, policy, live });

            await new Promise(resolve => setTimeout(resolve, 1500));
          }

          console.log('\n=== SUMMARY ===');
          for (const item of results) {
            const live = item.live;
            console.log(JSON.stringify({
              attempt: item.attempt,
              policyStatus: item.policy.status,
              policyDecision: item.policy.body?.decision ?? null,
              liveHttpStatus: live?.status ?? null,
              liveStatus: live?.body?.status ?? null,
              liveDecision: live?.body?.decision ?? null,
              liveReason: live?.body?.reason ?? live?.body?.error ?? null,
              evidenceStatus: live?.body?.evidence?.status ?? null,
              evidenceSpendRaw: live?.body?.evidence?.spendRaw ?? live?.body?.evidenceSpendRaw ?? null,
              riskTier: live?.body?.riskTier ?? null
            }));
          }
          NODE
