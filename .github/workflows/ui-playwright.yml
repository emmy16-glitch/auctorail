name: ProofGate UI Playwright

on:
  push:
    branches:
      - main
      - feat/live-authorize-first-screen
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofgate-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build web UI
        run: npm run web:build

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start ProofGate UI
        run: |
          npm run web:dev -- --host 127.0.0.1 --port 4173 > /tmp/proofgate-vite.log 2>&1 &
          echo $! > /tmp/proofgate-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proofgate-vite.log
          exit 1

      - name: Run functional Playwright QA
        run: python qa/first-screen-playwright-runner.py

      - name: Run typography and visual-fidelity audit
        run: python qa/ui-fidelity-audit.py

      - name: Run truthful error-state audit
        run: python qa/error-state-fidelity.py

      - name: Run dynamic limit-warning audit
        run: python qa/limit-warning-fidelity.py

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofgate-first-screen-playwright
          path: playwright-artifacts/
          if-no-files-found: warn
