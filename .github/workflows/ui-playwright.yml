name: Auctorail UI Playwright

on:
  push:
    branches:
      - main
      - feat/live-authorize-first-screen
  pull_request:

permissions:
  contents: read

concurrency:
  group: auctorail-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-product-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build web UI
        run: npm run web:build

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start unified Auctorail dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/auctorail-dev.log 2>&1 &
          echo $! > /tmp/auctorail-dev.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/auctorail-dev.log
          exit 1

      - name: Verify bundled local APIs
        run: |
          auth_ready=false
          for i in {1..30}; do
            if curl -fsS -o /dev/null -X OPTIONS http://127.0.0.1:4173/api/authorize; then
              auth_ready=true
              break
            fi
            sleep 1
          done
          if [ "$auth_ready" != "true" ]; then
            echo "Authorization API did not become ready."
            cat /tmp/auctorail-dev.log
            exit 1
          fi

          lab_ready=false
          for i in {1..30}; do
            if curl -fsS -X POST http://127.0.0.1:4173/api/security-lab \
              -H 'content-type: application/json' -d '{}' > /tmp/security-lab.json; then
              lab_ready=true
              break
            fi
            sleep 1
          done
          if [ "$lab_ready" != "true" ]; then
            echo "Security Lab API did not become ready."
            cat /tmp/auctorail-dev.log
            exit 1
          fi

          # Historical schema identifier is intentionally stable across the rename.
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/security-lab.json","utf8"));if(r.schemaVersion!=="proofgate.attack-lab.v1"||r.allPassed!==true||r.total!==10)process.exit(1)'

      - name: Run final landing, demo, live, SDK and Security Lab audit
        run: python qa/auctorail-final-playwright.py

      - name: Upload Auctorail UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auctorail-final-playwright
          path: playwright-artifacts/
          if-no-files-found: warn
