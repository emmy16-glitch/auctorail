name: Deploy Auctorail Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auctorail-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'deploy: production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_B3UZA8Zjc2LnB8A2nJhjfe5n
      VERCEL_PROJECT_ID: prj_rZ6wYUM1lXd1xn37JuRO2vDjL6uM

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt artifact
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
